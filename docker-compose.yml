version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      - MYSQLHOST=db
      - MYSQLPORT=3306
      - MYSQLDATABASE=aquaguard
      - MYSQLUSER=root
      - MYSQLPASSWORD=secret
    depends_on:
      - db

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: aquaguard
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./aquaguard_backup.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
